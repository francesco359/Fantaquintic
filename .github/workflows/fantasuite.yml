name: FantaSuite automatic update

on:
  workflow_dispatch:
  schedule:
    - cron: '17 1,7,13,19 * * *'
  push:
    branches: [main]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: fantasuite-pages
  cancel-in-progress: true

jobs:
  update-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Update real football data
        env:
          API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
        run: python update_data.py

      - name: Validate dataset
        run: python validate_data.py

      - name: Commit automatic data
        run: |
          if ! git diff --quiet -- latest.json manifest.json; then
            git config user.name "FantaSuite Bot"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add latest.json manifest.json
            git commit -m "Dati reali API-Football"
            git push
          fi

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4

