name: FantaSuite v13.4 Precision

on:
  schedule:
    - cron: "7,37 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: fantasuite-v134
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Prepara cartelle ed esegui aggiornamento
        run: |
          mkdir -p data/history
          python scripts/update_fantasuite.py

      - name: Verifica JSON
        run: |
          python -m json.tool data/latest.json > /dev/null
          python -m json.tool data/status.json > /dev/null

      - name: Pubblica aggiornamento
        run: |
          git config user.name "FantaSuite Bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/

          if git diff --cached --quiet; then
            echo "Nessuna modifica da pubblicare"
          else
            git commit -m "v13.4 precision update"
            git push
          fi
