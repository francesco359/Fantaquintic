name: FantaQuintoc HTML Update

on:
  schedule:
    - cron: "17 */2 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: fantaquintoc-html-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Scarica il repository
        uses: actions/checkout@v4

      - name: Configura Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Installa le dipendenze
        run: pip install -r requirements.txt

      - name: Aggiorna e valida i dati
        env:
          FANTASUITE_MIN_PLAYERS: "490"
        run: python scripts/update_fantasuite.py

      - name: Verifica i file generati
        run: |
          python -m json.tool data/latest.json > /dev/null
          python -m json.tool data/status.json > /dev/null
          python -m json.tool data/fantasuite.json > /dev/null

          python - <<'PY'
          import json

          with open("data/latest.json", encoding="utf-8") as file:
              data = json.load(file)

          players = data.get("players", [])
          validation = data.get("validation", {})
          errors = validation.get("critical_errors", [])

          assert len(players) >= 490, (
              f"Catalogo incompleto: {len(players)} giocatori"
          )

          assert not errors, (
              f"Errori critici rilevati: {errors}"
          )

          print("Giocatori:", len(players))
          print(
              "Aggiornamenti:",
              validation.get("player_updates", 0)
          )
          print(
              "Dati freschi:",
              validation.get("fresh_player_data", False)
          )
          PY

      - name: Pubblica l'aggiornamento
        run: |
          git config user.name "FantaQuintoc Bot"
          git config user.email "actions@users.noreply.github.com"

          git add data/

          if git diff --cached --quiet; then
            echo "Nessuna modifica da pubblicare"
          else
            git commit -m "Aggiornamento HTML validato"
            git push
          fi
