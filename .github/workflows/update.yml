

name: FantaSuite Auto Update

on:
  schedule:
    - cron: "7,37 * * * *"

  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: fantasuite-auto-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Scarica il repository
        uses: actions/checkout@v4

      - name: Configura Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Aggiorna FantaSuite
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            python scripts/update_fantasuite.py --force
          else
            python scripts/update_fantasuite.py
          fi

      - name: Verifica i JSON
        run: |
          python -m json.tool data/latest.json > /dev/null
          python -m json.tool data/status.json > /dev/null

      - name: Pubblica l'aggiornamento
        run: |
          git config user.name "FantaSuite Bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/

          if git diff --cached --quiet; then
            echo "Nessun aggiornamento da pubblicare"
          else
            git commit -m "Aggiornamento automatico FantaSuite"
            git push
          fi
